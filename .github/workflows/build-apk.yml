name: Build Trivandrum Pork POS v1.1.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - apk-build-v1.1.0

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "Android SDK location was not provided by the runner."
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Android sdkmanager was not found."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore refined Android project
        shell: bash
        run: |
          set -euo pipefail
          cat .github/android-source/source-*.b64 > /tmp/trivandrum-pork-pos.tar.gz.b64
          base64 --decode /tmp/trivandrum-pork-pos.tar.gz.b64 > /tmp/trivandrum-pork-pos.tar.gz
          gzip -t /tmp/trivandrum-pork-pos.tar.gz
          tar -xzf /tmp/trivandrum-pork-pos.tar.gz -C "$GITHUB_WORKSPACE"
          APP="TrivandrumPorkPOS-Android/app/src/main/java/com/trivandrumpork/pos/MainActivity.kt"
          # Compose saveable state lives in the saveable package.
          sed -i 's|import androidx.compose.runtime.rememberSaveable|import androidx.compose.runtime.saveable.rememberSaveable|' "$APP"
          # Modifier.weight is a RowScope/ColumnScope member; importing it directly is invalid.
          sed -i '/import androidx.compose.foundation.layout.weight/d' "$APP"
          test -f TrivandrumPorkPOS-Android/settings.gradle.kts
          test -f "$APP"
          test -f TrivandrumPorkPOS-Android/app/src/main/java/com/trivandrumpork/pos/InvoiceImageGenerator.kt
          grep -q 'import androidx.compose.runtime.saveable.rememberSaveable' "$APP"
          ! grep -q 'import androidx.compose.foundation.layout.weight' "$APP"

      - name: Save source inspection for review
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('TrivandrumPorkPOS-Android/app/src/main/java/com/trivandrumpork/pos/MainActivity.kt')
          lines = p.read_text().splitlines()
          needles = ('whatsapp', 'ACTION_SEND', 'EXTRA_STREAM', 'createChooser', 'sendBill', 'shareBill', 'jid', 'InvoiceImageGenerator')
          hits = [i for i, line in enumerate(lines) if any(n.lower() in line.lower() for n in needles)]
          out = ['FILE: ' + str(p), 'TOTAL LINES: ' + str(len(lines)), 'MATCHES: ' + str(hits)]
          out.append('===== MAIN ACTIVITY HEADER =====')
          out.extend(f'{j+1}: {lines[j]}' for j in range(min(170, len(lines))))
          out.append('===== BILL MODEL DECLARATIONS =====')
          for source in Path('TrivandrumPorkPOS-Android/app/src/main/java').rglob('*.kt'):
              for n, line in enumerate(source.read_text().splitlines(), 1):
                  if any(term in line.lower() for term in ('data class bill', 'class bill', 'customerphone', 'customer mobile', 'mobile:', 'phone:')):
                      out.append(f'{source}:{n}: {line}')
          shown = set()
          for i in hits:
              out.append(f'===== CONTEXT AROUND LINE {i+1} =====')
              for j in range(max(0, i-24), min(len(lines), i+36)):
                  if j not in shown:
                      out.append(f'{j+1}: {lines[j]}')
                      shown.add(j)
          Path('.github/android-share-inspection.txt').write_text('\\n'.join(out))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/android-share-inspection.txt
          git commit -m 'chore: capture Android WhatsApp share source [skip ci]'
          git push

      - name: Inspect WhatsApp sharing implementation
        shell: bash
        run: |
          set -euo pipefail
          echo '--- WhatsApp/share references in Android source ---'
          grep -RniE 'whatsapp|ACTION_SEND|EXTRA_STREAM|createChooser|sendBill|shareBill|share.*image|jid' TrivandrumPorkPOS-Android/app/src/main/java || true
          echo '--- MainActivity.kt relevant context ---'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('TrivandrumPorkPOS-Android/app/src/main/java/com/trivandrumpork/pos/MainActivity.kt')
          lines = p.read_text().splitlines()
          needles = ('whatsapp', 'ACTION_SEND', 'EXTRA_STREAM', 'createChooser', 'sendBill', 'shareBill', 'jid')
          hits = [i for i, line in enumerate(lines) if any(n.lower() in line.lower() for n in needles)]
          shown = set()
          for i in hits:
              for j in range(max(0, i-10), min(len(lines), i+16)):
                  if j not in shown:
                      print(f'{j+1}: {lines[j]}')
                      shown.add(j)
              print('---')
          PY

      - name: Build debug APK
        working-directory: TrivandrumPorkPOS-Android
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="TrivandrumPorkPOS-Android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          sha256sum "$APK"

      - name: Upload refined APK
        uses: actions/upload-artifact@v4
        with:
          name: TrivandrumPorkPOS-v1.1.0-debug-apk
          path: TrivandrumPorkPOS-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
