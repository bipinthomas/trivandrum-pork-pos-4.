name: Build Trivandrum Pork POS v1.7.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - apk-build-v1.6.0-loyalty

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "Android SDK location was not provided by the runner."
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Android sdkmanager was not found."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore refined Android project
        shell: bash
        run: |
          set -euo pipefail
          cat .github/android-source/source-*.b64 > /tmp/trivandrum-pork-pos.tar.gz.b64
          base64 --decode /tmp/trivandrum-pork-pos.tar.gz.b64 > /tmp/trivandrum-pork-pos.tar.gz
          gzip -t /tmp/trivandrum-pork-pos.tar.gz
          tar -xzf /tmp/trivandrum-pork-pos.tar.gz -C "$GITHUB_WORKSPACE"
          APP="TrivandrumPorkPOS-Android/app/src/main/java/com/trivandrumpork/pos/MainActivity.kt"
          # Compose saveable state lives in the saveable package.
          sed -i 's|import androidx.compose.runtime.rememberSaveable|import androidx.compose.runtime.saveable.rememberSaveable|' "$APP"
          # Modifier.weight is a RowScope/ColumnScope member; importing it directly is invalid.
          sed -i '/import androidx.compose.foundation.layout.weight/d' "$APP"
          test -f TrivandrumPorkPOS-Android/settings.gradle.kts
          test -f "$APP"
          test -f TrivandrumPorkPOS-Android/app/src/main/java/com/trivandrumpork/pos/InvoiceImageGenerator.kt
          grep -q 'import androidx.compose.runtime.saveable.rememberSaveable' "$APP"
          ! grep -q 'import androidx.compose.foundation.layout.weight' "$APP"

      - name: Fix direct WhatsApp recipient targeting
        shell: bash
        run: |
          set -euo pipefail
          APP="TrivandrumPorkPOS-Android/app/src/main/java/com/trivandrumpork/pos/MainActivity.kt"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("TrivandrumPorkPOS-Android/app/src/main/java/com/trivandrumpork/pos/MainActivity.kt")
          source = p.read_text()
          start_marker = "private fun shareInvoiceImage("
          end_marker = "\nprivate fun isPackageInstalled"
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Could not locate the invoice-sharing helper; refusing to create an unverified build.")
          replacement = """private fun shareInvoiceImage(context: Context, imageFile: File, bill: Bill, settings: BusinessSettings) {
              // WhatsApp's JID extra targets a phone number directly, including numbers not saved in Contacts.
              val enteredNumber = bill.mobile.filter { it.isDigit() }
              val recipientNumber = when {
                  enteredNumber.length == 10 -> "91$enteredNumber"
                  enteredNumber.length == 11 && enteredNumber.startsWith("0") -> "91${enteredNumber.drop(1)}"
                  enteredNumber.length in 11..15 -> enteredNumber
                  else -> ""
              }
              if (recipientNumber.isBlank()) {
                  Toast.makeText(context, "Customer mobile number is invalid. Update the bill and try again.", Toast.LENGTH_LONG).show()
                  return
              }

              val uri: Uri = FileProvider.getUriForFile(context, "${context.packageName}.fileprovider", imageFile)
              val intent = Intent(Intent.ACTION_SEND).apply {
                  type = "image/png"
                  putExtra(Intent.EXTRA_STREAM, uri)
                  putExtra(Intent.EXTRA_TEXT, "Thank you for ordering from ${settings.businessName}!\\nBill: ${bill.billNo}\\nTotal: ${rupees(bill.total)}")
                  putExtra("jid", "${recipientNumber}@s.whatsapp.net")
                  clipData = ClipData.newUri(context.contentResolver, "${bill.billNo} invoice", uri)
                  addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
              }
              val whatsappBusiness = "com.whatsapp.w4b"
              val whatsapp = "com.whatsapp"
              val installedPackage = when {
                  isPackageInstalled(context, whatsappBusiness) -> whatsappBusiness
                  isPackageInstalled(context, whatsapp) -> whatsapp
                  else -> null
              }

              if (installedPackage != null) {
                  // Keep the image attached and open the exact customer's chat, even when the number is unsaved.
                  intent.setPackage(installedPackage)
                  context.startActivity(intent)
              } else {
                  context.startActivity(Intent.createChooser(intent, "Share invoice image"))
              }
          }"""
          source = source[:start] + replacement + source[end:]
          old_help = "The app generates an invoice PNG and opens WhatsApp Business when it is installed. Choose the customer's chat in WhatsApp to send the image."
          new_help = "The app generates an invoice PNG and opens the customer's WhatsApp chat directly using the mobile number on the bill. Review the invoice and press Send."
          if old_help in source:
              source = source.replace(old_help, new_help, 1)
          p.write_text(source)
          PY
          grep -q 'putExtra("jid"' "$APP"
          grep -q 'val recipientNumber' "$APP"

      - name: Apply category, discounts, reports and invoice updates
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_v1_3.py
          grep -q 'category_discounts' TrivandrumPorkPOS-Android/app/src/main/java/com/trivandrumpork/pos/data/PosDatabase.kt
          grep -q 'SalesExcelExporter.generate' TrivandrumPorkPOS-Android/app/src/main/java/com/trivandrumpork/pos/MainActivity.kt
          grep -q 'putExtra("jid"' TrivandrumPorkPOS-Android/app/src/main/java/com/trivandrumpork/pos/MainActivity.kt
          grep -q 'versionName = "1.3.0"' TrivandrumPorkPOS-Android/app/build.gradle.kts

      - name: Apply FSSAI and kitchen WhatsApp updates
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_v1_4.py
          APP="TrivandrumPorkPOS-Android/app/src/main/java/com/trivandrumpork/pos/MainActivity.kt"
          DB="TrivandrumPorkPOS-Android/app/src/main/java/com/trivandrumpork/pos/data/PosDatabase.kt"
          INVOICE="TrivandrumPorkPOS-Android/app/src/main/java/com/trivandrumpork/pos/InvoiceImageGenerator.kt"
          grep -q 'fssaiNumber' "$DB"
          grep -q 'kitchenWhatsAppNumber' "$DB"
          grep -q 'FSSAI Lic. No.' "$INVOICE"
          grep -q 'KitchenOrderImageGenerator' "$APP"
          grep -q 'putExtra("jid"' "$APP"
          grep -q 'versionName = "1.4.0"' TrivandrumPorkPOS-Android/app/build.gradle.kts

      - name: Apply full offline backup and restore
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_v1_5_backup.py
          MAIN="TrivandrumPorkPOS-Android/app/src/main/java/com/trivandrumpork/pos/MainActivity.kt"
          BACKUP="TrivandrumPorkPOS-Android/app/src/main/java/com/trivandrumpork/pos/PosBackupManager.kt"
          test -s "$BACKUP"
          grep -q 'Restore from Backup File' "$MAIN"
          grep -q 'PosBackupManager.restoreBackup' "$MAIN"
          grep -q 'PosBackupManager.createBackup' "$MAIN"
          grep -q 'versionName = "1.5.0"' TrivandrumPorkPOS-Android/app/build.gradle.kts

      - name: Apply v1.6.0 bill branding and customer loyalty
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_v1_6.py
          DB="TrivandrumPorkPOS-Android/app/src/main/java/com/trivandrumpork/pos/data/PosDatabase.kt"
          MAIN="TrivandrumPorkPOS-Android/app/src/main/java/com/trivandrumpork/pos/MainActivity.kt"
          INVOICE="TrivandrumPorkPOS-Android/app/src/main/java/com/trivandrumpork/pos/InvoiceImageGenerator.kt"
          EXPORTER="TrivandrumPorkPOS-Android/app/src/main/java/com/trivandrumpork/pos/SalesExcelExporter.kt"
          test -s TrivandrumPorkPOS-Android/app/src/main/res/drawable-nodpi/trivandrum_pork_header.webp
          grep -q 'loyalty_customers' "$DB"
          grep -q 'redeemLoyaltyPoints' "$DB"
          grep -q 'LoyaltyScreen' "$MAIN"
          grep -q 'Special discount applied, you saved' "$INVOICE"
          grep -q 'Loyalty Points Earned' "$EXPORTER"
          grep -q 'versionName = "1.6.0"' TrivandrumPorkPOS-Android/app/build.gradle.kts


      - name: Apply v1.7.0 kitchen sharing and logo fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_v1_7.py
          MAIN="TrivandrumPorkPOS-Android/app/src/main/java/com/trivandrumpork/pos/MainActivity.kt"
          DB="TrivandrumPorkPOS-Android/app/src/main/java/com/trivandrumpork/pos/data/PosDatabase.kt"
          INVOICE="TrivandrumPorkPOS-Android/app/src/main/java/com/trivandrumpork/pos/InvoiceImageGenerator.kt"
          KITCHEN="TrivandrumPorkPOS-Android/app/src/main/java/com/trivandrumpork/pos/KitchenOrderImageGenerator.kt"
          MANIFEST="TrivandrumPorkPOS-Android/app/src/main/AndroidManifest.xml"
          test -s TrivandrumPorkPOS-Android/app/src/main/res/drawable-nodpi/trivandrum_pork_logo.webp
          grep -q 'Kitchen WhatsApp Number' "$MAIN"
          grep -q 'kitchenWhatsAppNumber' "$DB"
          grep -q 'R.drawable.trivandrum_pork_logo' "$MAIN"
          grep -q 'trivandrum_pork_logo' "$INVOICE"
          grep -q 'item.productName' "$KITCHEN"
          grep -q 'item.quantity' "$KITCHEN"
          ! grep -q 'KITCHEN ORDER' "$KITCHEN"
          grep -q 'pos_file_paths' "$MANIFEST"
          grep -q 'cache-path' TrivandrumPorkPOS-Android/app/src/main/res/xml/pos_file_paths.xml
          grep -q 'versionName = "1.7.0"' TrivandrumPorkPOS-Android/app/build.gradle.kts

      - name: Build debug APK
        working-directory: TrivandrumPorkPOS-Android
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="TrivandrumPorkPOS-Android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          sha256sum "$APK"

      - name: Upload v1.7.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: TrivandrumPorkPOS-v1.7.0-kitchen-logo-debug-apk
          path: TrivandrumPorkPOS-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

